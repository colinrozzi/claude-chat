<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat</title>
    <link rel="stylesheet" href="/styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- Markdown-it for markdown parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="https://www.anthropic.com/images/claude_insignia_white.svg" alt="Claude Logo" class="logo">
            <h1>Claude Chat</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>
    </header>
    
    <div class="container">
        <div class="app-layout">
            <!-- Left sidebar with conversations -->
            <div class="conversations-sidebar" id="conversations-sidebar">
                <button id="toggle-left-sidebar" class="sidebar-toggle" aria-label="Toggle conversations sidebar">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="conversations-header">
                    <span class="conversations-title">CONVERSATIONS</span>
                </div>
                <button id="new-conversation" class="new-conversation-btn">
                    <i class="fas fa-plus"></i> New Chat
                </button>
                <div id="conversation-list">
                    <!-- Conversations will be added here -->
                </div>
            </div>
            
            <!-- Main chat panel -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="chat-title" id="current-chat-title">New Conversation</div>
                </div>
                
                <div id="chat-messages" class="chat-messages">
                    <!-- Messages will be added here -->
                </div>
                
                <div id="typing-indicator" class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                
                <div class="chat-input">
                    <textarea id="message-input" placeholder="Type your message here..." disabled></textarea>
                    <button id="send-button" disabled>
                        <i class="fas fa-paper-plane"></i> Send
                    </button>
                </div>
            </div>
            
            <!-- Right sidebar for chat controls -->
            <div class="controls-sidebar" id="controls-sidebar">
                <button id="toggle-right-sidebar" class="sidebar-toggle" aria-label="Toggle settings sidebar">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <div class="sidebar-section">
                    <h3 class="sidebar-title">Chat Settings</h3>
                    <div class="sidebar-content">
                        <div class="system-prompt">
                            <label for="system-prompt-input" class="system-prompt-label">System prompt</label>
                            <textarea id="system-prompt-input" placeholder="You are a helpful AI assistant..." disabled></textarea>
                        </div>
                        
                        <div class="setting-group">
                            <h4 class="setting-title">Chat Information</h4>
                            <div class="setting-item">
                                <span class="setting-label">Created</span>
                                <span class="setting-value" id="chat-created-time">-</span>
                            </div>
                            <div class="setting-item">
                                <span class="setting-label">Messages</span>
                                <span class="setting-value" id="chat-message-count">0</span>
                            </div>
                        </div>
                        
                        <div class="setting-group">
                            <h4 class="setting-title">Actions</h4>
                            <button id="rename-chat-btn" class="control-btn" disabled>
                                <i class="fas fa-edit"></i> Rename Chat
                            </button>
                            <button id="clear-chat-btn" class="control-btn" disabled>
                                <i class="fas fa-trash"></i> Clear Chat
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast notifications container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Rename dialog -->
    <div id="rename-dialog" class="dialog-overlay">
        <div class="dialog">
            <div class="dialog-header">Rename Conversation</div>
            <input type="text" id="rename-input" class="dialog-input" placeholder="Enter a name for this conversation">
            <div class="dialog-buttons">
                <button id="rename-cancel" class="dialog-button dialog-button-cancel">Cancel</button>
                <button id="rename-confirm" class="dialog-button dialog-button-confirm">Rename</button>
            </div>
        </div>
    </div>
    
    <script>
    // Make elements and state available globally
    window.elements = {};
    window.layoutState = {
        leftSidebarCollapsed: false,
        rightSidebarCollapsed: false
    };
    
    // Simple direct sidebar toggle functions
    function toggleLeftSidebar() {
        const appLayout = document.querySelector('.app-layout');
        window.layoutState.leftSidebarCollapsed = !window.layoutState.leftSidebarCollapsed;
        
        if (window.layoutState.leftSidebarCollapsed) {
            appLayout.classList.add('left-collapsed');
        } else {
            appLayout.classList.remove('left-collapsed');
        }
        
        // Handle both sidebars collapsed
        updateBothCollapsedState();
        
        // Save state
        localStorage.setItem('leftSidebarCollapsed', window.layoutState.leftSidebarCollapsed);
    }
    
    function toggleRightSidebar() {
        const appLayout = document.querySelector('.app-layout');
        window.layoutState.rightSidebarCollapsed = !window.layoutState.rightSidebarCollapsed;
        
        if (window.layoutState.rightSidebarCollapsed) {
            appLayout.classList.add('right-collapsed');
        } else {
            appLayout.classList.remove('right-collapsed');
        }
        
        // Handle both sidebars collapsed
        updateBothCollapsedState();
        
        // Save state
        localStorage.setItem('rightSidebarCollapsed', window.layoutState.rightSidebarCollapsed);
    }
    
    function updateBothCollapsedState() {
        const appLayout = document.querySelector('.app-layout');
        
        if (window.layoutState.leftSidebarCollapsed && window.layoutState.rightSidebarCollapsed) {
            appLayout.classList.add('both-collapsed');
        } else {
            appLayout.classList.remove('both-collapsed');
        }
    }
    
    // Initialize sidebar state after DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize sidebar state
        const savedLeftCollapsed = localStorage.getItem('leftSidebarCollapsed') === 'true';
        const savedRightCollapsed = localStorage.getItem('rightSidebarCollapsed') === 'true';
        
        // Set initial state
        window.layoutState.leftSidebarCollapsed = savedLeftCollapsed;
        window.layoutState.rightSidebarCollapsed = savedRightCollapsed;
        
        const appLayout = document.querySelector('.app-layout');
        
        // Apply initial classes
        if (savedLeftCollapsed) {
            appLayout.classList.add('left-collapsed');
        }
        if (savedRightCollapsed) {
            appLayout.classList.add('right-collapsed');
        }
        if (savedLeftCollapsed && savedRightCollapsed) {
            appLayout.classList.add('both-collapsed');
        }
        
        // Setup toggle button event listeners directly
        document.getElementById('toggle-left-sidebar').addEventListener('click', toggleLeftSidebar);
        document.getElementById('toggle-right-sidebar').addEventListener('click', toggleRightSidebar);
    });
</script>
<script type="module" src="/bundle.js"></script>
</body>
</html>
