<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #5C48F6;
            color: white;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            display: flex;
            height: calc(100vh - 200px);
            gap: 1rem;
        }
        .conversations {
            flex: 0 0 250px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 1rem;
            overflow-y: auto;
        }
        .conversation-btn {
            background: #f2f2f2;
            border: none;
            border-radius: 4px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .conversation-btn:hover {
            background: #e8e8e8;
        }
        .conversation-btn.active {
            background: #e0e7ff;
            font-weight: bold;
        }
        .new-conversation-btn {
            background: #5C48F6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem;
            margin-bottom: 1rem;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .new-conversation-btn:hover {
            background: #4736C8;
        }
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            max-width: 80%;
        }
        .message.user {
            background: #e0e7ff;
            align-self: flex-end;
            margin-left: auto;
        }
        .message.assistant {
            background: #f2f2f2;
            align-self: flex-start;
        }
        .message-header {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .message-content {
            white-space: pre-wrap;
        }
        .chat-input {
            display: flex;
            padding: 1rem;
            border-top: 1px solid #eee;
            gap: 0.5rem;
        }
        .chat-input textarea {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: none;
            height: 60px;
            font-family: inherit;
        }
        .chat-input button {
            background: #5C48F6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover {
            background: #4736C8;
        }
        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .system-prompt {
            margin-top: 0.5rem;
            width: 100%;
        }
        .system-prompt textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: none;
            height: 40px;
            font-family: inherit;
            font-size: 0.85rem;
        }
        .system-prompt-label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            color: #666;
        }
        .typing-indicator {
            display: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: #f2f2f2;
            align-self: flex-start;
            margin-bottom: 1rem;
        }
        .typing-indicator.active {
            display: block;
        }
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 3px;
            background: #888;
            animation: wave 1.3s linear infinite;
        }
        .dot:nth-child(2) {
            animation-delay: -1.1s;
        }
        .dot:nth-child(3) {
            animation-delay: -0.9s;
        }
        @keyframes wave {
            0%, 60%, 100% { transform: initial; }
            30% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Claude Chat</h1>
    </header>
    <div class="container">
        <div class="chat-container">
            <div class="conversations">
                <button id="new-conversation" class="new-conversation-btn">New Conversation</button>
                <div id="conversation-list">
                    <!-- Conversations will be added here -->
                </div>
            </div>
            <div class="chat-panel">
                <div id="chat-messages" class="chat-messages">
                    <!-- Messages will be added here -->
                </div>
                <div id="typing-indicator" class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="chat-input">
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <textarea id="message-input" placeholder="Type your message here..." disabled></textarea>
                        <div class="system-prompt">
                            <label for="system-prompt-input" class="system-prompt-label">System prompt (optional)</label>
                            <textarea id="system-prompt-input" placeholder="You are a helpful AI assistant..." disabled></textarea>
                        </div>
                    </div>
                    <button id="send-button" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        const state = {
            websocket: null,
            conversations: [],
            activeConversationId: null,
            messages: {},
            connected: false
        };

        // DOM elements
        const elements = {
            conversationList: document.getElementById('conversation-list'),
            chatMessages: document.getElementById('chat-messages'),
            messageInput: document.getElementById('message-input'),
            systemPromptInput: document.getElementById('system-prompt-input'),
            sendButton: document.getElementById('send-button'),
            newConversationButton: document.getElementById('new-conversation'),
            typingIndicator: document.getElementById('typing-indicator')
        };

        // Initialize WebSocket connection
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const wsUrl = `${protocol}://${window.location.host}/ws`;
            
            state.websocket = new WebSocket(wsUrl);
            
            state.websocket.onopen = () => {
                console.log('WebSocket connection established');
                state.connected = true;
                elements.newConversationButton.disabled = false;
            };
            
            state.websocket.onmessage = (event) => {
                handleServerMessage(JSON.parse(event.data));
            };
            
            state.websocket.onclose = () => {
                console.log('WebSocket connection closed');
                state.connected = false;
                elements.messageInput.disabled = true;
                elements.systemPromptInput.disabled = true;
                elements.sendButton.disabled = true;
                elements.newConversationButton.disabled = true;
                
                // Try to reconnect after a delay
                setTimeout(initWebSocket, 3000);
            };
            
            state.websocket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        // Handle messages from the server
        function handleServerMessage(message) {
            console.log('Received message:', message);
            
            switch (message.message_type) {
                case 'conversation_created':
                    handleConversationCreated(message);
                    break;
                    
                case 'message':
                    handleIncomingMessage(message);
                    break;
                    
                case 'error':
                    handleError(message);
                    break;
                    
                default:
                    console.warn('Unknown message type:', message.message_type);
            }
        }

        // Handle conversation created message
        function handleConversationCreated(message) {
            const conversationId = message.conversation_id;
            
            // Add to list of conversations
            if (!state.conversations.includes(conversationId)) {
                state.conversations.push(conversationId);
                state.messages[conversationId] = [];
            }
            
            // Set as active conversation
            setActiveConversation(conversationId);
            
            // Update UI
            updateConversationList();
            
            // Enable chat inputs
            elements.messageInput.disabled = false;
            elements.systemPromptInput.disabled = false;
            elements.sendButton.disabled = false;
            elements.messageInput.focus();
        }

        // Handle incoming message
        function handleIncomingMessage(message) {
            const { conversation_id, content } = message;
            
            // Hide typing indicator
            elements.typingIndicator.classList.remove('active');
            
            // Add message to state
            if (!state.messages[conversation_id]) {
                state.messages[conversation_id] = [];
            }
            
            state.messages[conversation_id].push({
                role: 'assistant',
                content: content,
                timestamp: Date.now()
            });
            
            // Update UI if this is the active conversation
            if (conversation_id === state.activeConversationId) {
                appendMessage('assistant', content);
            }
            
            // Enable inputs
            elements.messageInput.disabled = false;
            elements.sendButton.disabled = false;
        }

        // Handle error message
        function handleError(message) {
            console.error('Error:', message);
            
            // Hide typing indicator
            elements.typingIndicator.classList.remove('active');
            
            // Show error in chat if associated with a conversation
            if (message.conversation_id && message.conversation_id === state.activeConversationId) {
                appendSystemMessage(`Error: ${message.content}`);
            } else {
                appendSystemMessage(`Error: ${message.content}`);
            }
            
            // Enable inputs
            elements.messageInput.disabled = false;
            elements.sendButton.disabled = false;
        }

        // Send message to server
        function sendMessage() {
            if (!state.connected || !state.activeConversationId) return;
            
            const content = elements.messageInput.value.trim();
            const systemPrompt = elements.systemPromptInput.value.trim();
            
            if (!content) return;
            
            // Disable inputs while waiting for response
            elements.messageInput.disabled = true;
            elements.sendButton.disabled = true;
            
            // Add message to UI
            appendMessage('user', content);
            
            // Add to state
            state.messages[state.activeConversationId].push({
                role: 'user',
                content: content,
                timestamp: Date.now()
            });
            
            // Clear input
            elements.messageInput.value = '';
            
            // Show typing indicator
            elements.typingIndicator.classList.add('active');
            
            // Send to server
            const message = {
                action: 'send_message',
                conversation_id: state.activeConversationId,
                message: content,
                system: systemPrompt || undefined
            };
            
            state.websocket.send(JSON.stringify(message));
        }

        // Create a new conversation
        function createNewConversation() {
            if (!state.connected) return;
            
            const message = {
                action: 'new_conversation'
            };
            
            state.websocket.send(JSON.stringify(message));
        }

        // Set active conversation
        function setActiveConversation(conversationId) {
            state.activeConversationId = conversationId;
            
            // Update UI
            updateConversationList();
            updateChatMessages();
            
            // Enable inputs
            elements.messageInput.disabled = false;
            elements.systemPromptInput.disabled = false;
            elements.sendButton.disabled = false;
        }

        // Update the conversation list UI
        function updateConversationList() {
            elements.conversationList.innerHTML = '';
            
            state.conversations.forEach(id => {
                const button = document.createElement('button');
                button.classList.add('conversation-btn');
                if (id === state.activeConversationId) {
                    button.classList.add('active');
                }
                
                // Format ID for display (remove the "conv-" prefix and timestamp)
                const displayId = id.split('-').pop();
                button.textContent = `Conversation ${displayId}`;
                
                button.addEventListener('click', () => setActiveConversation(id));
                elements.conversationList.appendChild(button);
            });
        }

        // Update the chat messages UI
        function updateChatMessages() {
            elements.chatMessages.innerHTML = '';
            
            if (!state.activeConversationId || !state.messages[state.activeConversationId]) return;
            
            state.messages[state.activeConversationId].forEach(msg => {
                appendMessage(msg.role, msg.content);
            });
            
            // Scroll to bottom
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        // Append a message to the chat UI
        function appendMessage(role, content) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', role);
            
            const header = document.createElement('div');
            header.classList.add('message-header');
            header.textContent = role === 'user' ? 'You' : 'Claude';
            
            const messageContent = document.createElement('div');
            messageContent.classList.add('message-content');
            messageContent.textContent = content;
            
            messageElement.appendChild(header);
            messageElement.appendChild(messageContent);
            
            elements.chatMessages.appendChild(messageElement);
            
            // Scroll to bottom
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        // Append a system message to the chat UI
        function appendSystemMessage(content) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', 'system');
            messageElement.style.background = '#ffe0e0';
            messageElement.style.color = '#d32f2f';
            messageElement.style.padding = '0.5rem 1rem';
            messageElement.style.borderRadius = '8px';
            messageElement.style.marginBottom = '1rem';
            messageElement.style.fontStyle = 'italic';
            
            const messageContent = document.createElement('div');
            messageContent.classList.add('message-content');
            messageContent.textContent = content;
            
            messageElement.appendChild(messageContent);
            
            elements.chatMessages.appendChild(messageElement);
            
            // Scroll to bottom
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        // Event listeners
        elements.sendButton.addEventListener('click', sendMessage);
        elements.messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        elements.newConversationButton.addEventListener('click', createNewConversation);

        // Initialize
        initWebSocket();
    </script>
</body>
</html>
